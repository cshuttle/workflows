# Reusable release for a repo whose artifact is one or more container images.
#
# WHAT A RELEASE IS HERE. Not a build. The image was already built and tested
# when the commit merged; this workflow PROMOTES that existing digest to a
# version tag, then records it as a git tag + GitHub Release. Rebuilding on the
# tag would produce a second digest from the same source — a different artifact
# to the one CI actually tested, and double the build minutes for the privilege
# (cshuttle/workflows#28).
#
# Callers wire a dispatch button, because the version is a HUMAN decision: a
# major here means "the deploy needs a human step", which no commit message can
# be trusted to encode (cshuttle/workflows#26, #30).
#
#   # .github/workflows/release.yml in the app repo
#   name: release
#   on:
#     workflow_dispatch:
#       inputs:
#         version:
#           description: "Version to release, e.g. v1.2.0"
#           required: true
#         summary:
#           description: "Optional paragraph shown above the generated notes"
#           required: false
#   jobs:
#     release:
#       uses: cshuttle/workflows/.github/workflows/release-image.yml@v1.1.0
#       permissions:
#         contents: write   # push the tag, create the release
#         packages: write   # add the version tag to the ghcr package
#       with:
#         version: ${{ inputs.version }}
#         summary: ${{ inputs.summary }}
#         images: ghcr.io/cshuttle/topology
#         runner: arc-topology
#       secrets:
#         # Only if the repo pushes with a classic PAT — see the secret's
#         # description. Omit and GITHUB_TOKEN is used.
#         ghcr-token: ${{ secrets.GHCR_WRITE_TOKEN }}
#
# NOT covered: repos whose artifact is a compiled binary rather than an image.
# There is exactly one of those (chrome-exporter) and its build is nothing like
# this one, so it stays in-repo until a second binary makes the duplication real
# (cshuttle/workflows#31). The version SCHEME is shared regardless.
name: release-image

on:
  workflow_call:
    inputs:
      version:
        description: >-
          The version to release, e.g. `v1.2.0`. Validated as `vMAJOR.MINOR.PATCH`
          with an optional prerelease suffix. Rejected if the tag already exists —
          released tags are immutable and are never moved (see this repo's README).
        type: string
        required: true
      images:
        description: >-
          Images to promote, WITHOUT a tag, whitespace- or newline-separated.
          Multiple images version together: `ghcr.io/cshuttle/atlas` and its
          sidecar are one release, not two.
        type: string
        required: true
      summary:
        description: >-
          Optional paragraph rendered ABOVE the generated notes. Leave empty for
          routine releases — notes must never be the thing blocking a release.
        type: string
        default: ""
        required: false
      runner:
        description: >-
          runs-on target. Repos pass their ARC scale set (`arc-<repo>`);
          GitHub-hosted runners are disabled estate-wide, so the default here is
          a deliberate footgun-avoider rather than a useful value.
        type: string
        default: ubuntu-latest
        required: false
      tag-prefix:
        description: >-
          Prefix for the GIT tag only, e.g. `chrome-exporter/` for a component
          released from inside a larger repo. Never applied to the IMAGE tag —
          `/` is not legal in a docker tag, and the image is already namespaced
          by its own repository path.
        type: string
        default: ""
        required: false
      source-tag:
        description: The mutable tag whose digest is being promoted.
        type: string
        default: latest
        required: false
      verify-source-commit:
        description: >-
          Refuse to release unless the source tag's digest belongs to a commit on
          the ref being released — the guard against releasing whatever happened
          to be `:latest` (a build still running, one that failed after the
          merge, or a build from another branch). The matched commit is also what
          the git tag is created on. Set false only for a repo that publishes no
          per-commit tags.
        type: boolean
        default: true
        required: false
      require-same-commit:
        description: >-
          Require every image to resolve to ONE build commit. Correct when a
          single workflow builds them together (an app and its sidecar), where a
          mismatch means a half-updated pair shipping under one version. WRONG
          for a repo whose images are built by separate, path-filtered workflows:
          those components change independently and almost never share a commit,
          so the release is legitimately "SPA built at X plus config built at Y".
          Set false there — each image is still verified against this branch's
          history, and the tag lands on the newest resolved commit.
        type: boolean
        default: true
        required: false
      verify-depth:
        description: >-
          How many commits back to search for the build. Needs to cover the gap
          between the ref's HEAD and the last commit that changed a build input —
          repos with paths-filtered builds accumulate docs and CI commits in
          between, and each one widens that gap.
        type: number
        default: 50
        required: false
      crane-version:
        description: go-containerregistry release to use.
        type: string
        default: v0.21.7
        required: false
    secrets:
      ghcr-token:
        description: >-
          Classic PAT with write:packages, for a package the repo-scoped
          GITHUB_TOKEN cannot touch. `cshuttle` is a personal account, so a
          package bootstrapped by a manual push is USER-owned: GITHUB_TOKEN 403s
          on it — including on reads — unless that package grants this repo
          access under Package settings -> Manage Actions access. Repos that
          push with a classic PAT must pass the same one here, or the promote
          step reports the image as missing when it is really unreadable.
        required: false
    outputs:
      tag:
        description: The git tag created.
        value: ${{ jobs.release.outputs.tag }}
      digest:
        description: Digest of the first promoted image.
        value: ${{ jobs.release.outputs.digest }}
      release-commit:
        description: >-
          The commit the released image was built from. Equals the ref's HEAD
          unless later commits changed no build inputs.
        value: ${{ jobs.release.outputs.release_commit }}

# One release at a time per repo. Two concurrent runs would race on the same tag
# and the loser would fail halfway, after promoting images but before tagging.
concurrency:
  group: release-image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    outputs:
      tag: ${{ steps.plan.outputs.git_tag }}
      digest: ${{ steps.promote.outputs.digest }}
      release_commit: ${{ steps.promote.outputs.release_commit }}
    steps:
      - name: validate the version
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -eu
          # Reject early and loudly. The alternative is a bad tag reaching the
          # remote, where it cannot be fixed by moving it — only by superseding.
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::version must look like v1.2.3 (optionally v1.2.3-rc.1) — got '$VERSION'"
            exit 1
          fi
          echo "git_tag=${PREFIX}${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "releasing ${PREFIX}${VERSION}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags are needed to answer "does this one already exist?" locally,
          # and the annotated tag is created from this checkout.
          fetch-depth: 0

      - name: refuse to reuse a tag
        env:
          GIT_TAG: ${{ steps.plan.outputs.git_tag }}
        run: |
          set -eu
          # Checked against the REMOTE, not just the local checkout: a tag pushed
          # from elsewhere since this clone was made is still a tag that exists.
          if git ls-remote --exit-code --tags origin "refs/tags/$GIT_TAG" >/dev/null 2>&1; then
            echo "::error::tag $GIT_TAG already exists — released tags are immutable."
            echo "::error::Supersede it with a new patch version instead of moving it."
            exit 1
          fi

      - name: install crane
        run: |
          set -eu
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/${{ inputs.crane-version }}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp crane
          /tmp/crane version

      - name: log in to ghcr
        env:
          GHCR_TOKEN: ${{ secrets.ghcr-token }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          set -eu
          if [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | /tmp/crane auth login ghcr.io -u "$GHCR_USER" --password-stdin
            echo "authenticated to ghcr as $GHCR_USER with the supplied token"
          else
            printf '%s' "${{ github.token }}" | /tmp/crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "authenticated to ghcr with GITHUB_TOKEN"
          fi

      # The heart of it: work out which commit the image actually came from,
      # prove it belongs to this branch, then move the version tag onto that
      # exact digest.
      - name: promote the tested digest
        id: promote
        env:
          IMAGES: ${{ inputs.images }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          IMAGE_TAG: ${{ steps.plan.outputs.image_tag }}
          VERIFY: ${{ inputs.verify-source-commit }}
          SAME_COMMIT: ${{ inputs.require-same-commit }}
          DEPTH: ${{ inputs.verify-depth }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          first_digest=""
          # The commit the release tag will point at. With verification off we
          # can only assume the ref's HEAD; with it on, it is discovered below
          # and may legitimately be an ancestor.
          RELEASE_COMMIT=""
          BEHIND=0
          # Collected in a file, not a shell string: appending indented
          # here-lines would carry their leading whitespace into the release
          # body, where markdown reads 4+ spaces as a code block.
          : > /tmp/released-images.md

          for img in $IMAGES; do
            echo "── $img"
            if ! digest="$(/tmp/crane digest "$img:$SOURCE_TAG" 2>&1)"; then
              echo "::error::cannot read $img:$SOURCE_TAG — crane said: $digest"
              echo "::error::If the tag plainly exists, this is almost certainly AUTH, not absence:"
              echo "::error::a user-owned ghcr package returns the same 'not found' for an unauthorised"
              echo "::error::read. Pass the repo's classic PAT as the ghcr-token secret, or grant this"
              echo "::error::repo access under the package's Manage Actions access settings."
              exit 1
            fi
            echo "   $SOURCE_TAG = $digest"

            if [ "$VERIFY" = "true" ]; then
              # WHICH COMMIT IS THIS IMAGE? Not necessarily HEAD. Build workflows
              # carry paths filters, so a docs- or CI-only commit moves the branch
              # without producing an image — and then HEAD has no tag at all.
              # Requiring an exact HEAD match would make those repos unreleasable
              # until someone touched a build input, which is absurd.
              #
              # Instead, walk back from the ref being released and find the most
              # recent commit whose per-commit tag carries this digest. That both
              # proves the image came from THIS branch's history (not some other
              # branch or a stale build) and tells us which commit to tag.
              #
              # One `crane ls` up front, then membership is a local grep -Fxq —
              # otherwise this is a registry round trip per commit per tag form.
              tags="$(/tmp/crane ls "$img" 2>/dev/null || true)"
              release_commit=""
              matched=""
              for c in $(git rev-list -n "$DEPTH" "$SHA"); do
                cs="$(printf '%s' "$c" | cut -c1-7)"
                # Repos tag per-commit differently — full sha, 7-char short, or
                # `sha-<short>`. Try each rather than making callers declare it.
                for cand in "$c" "$cs" "sha-$cs"; do
                  printf '%s\n' "$tags" | grep -Fxq "$cand" || continue
                  if cd="$(/tmp/crane digest "$img:$cand" 2>/dev/null)" && [ "$cd" = "$digest" ]; then
                    release_commit="$c"
                    matched="$cand"
                    break
                  fi
                done
                [ -n "$release_commit" ] && break
              done
              if [ -z "$release_commit" ]; then
                echo "::error::$img:$SOURCE_TAG does not match any of the last $DEPTH commits on this ref."
                echo "::error::Its digest is $digest, tagged by none of them."
                echo "::error::Either the build for this branch has not finished (or failed), or"
                echo "::error::$SOURCE_TAG points at a build from somewhere else entirely."
                echo "::error::Releasing now would ship something this branch never produced."
                exit 1
              fi
              behind="$(git rev-list --count "$release_commit..$SHA")"
              echo "   verified: built from $release_commit (tag $matched), $behind commit(s) behind the ref"
              if [ -n "$RELEASE_COMMIT" ] && [ "$RELEASE_COMMIT" != "$release_commit" ]; then
                if [ "$SAME_COMMIT" = "true" ]; then
                  echo "::error::images disagree about which commit they were built from:"
                  echo "::error::  $RELEASE_COMMIT vs $release_commit ($img)."
                  echo "::error::Images released together must come from one build."
                  echo "::error::If these components are built by separate path-filtered"
                  echo "::error::workflows, they change independently — set require-same-commit: false."
                  exit 1
                fi
                echo "   note: differs from $RELEASE_COMMIT — independent components, allowed"
              fi
              # Keep the NEWEST resolved commit: with independent components the
              # release is "everything up to here", and the oldest would name a
              # commit that predates code being shipped.
              if [ -z "$RELEASE_COMMIT" ] || [ "$behind" -lt "$BEHIND" ]; then
                RELEASE_COMMIT="$release_commit"
                BEHIND="$behind"
              fi
            fi

            # Tag BY DIGEST, not by re-resolving :latest. Between the check above
            # and this line a new build could land; promoting the ref we already
            # verified closes that window.
            /tmp/crane tag "$img@$digest" "$IMAGE_TAG"
            echo "   tagged $IMAGE_TAG"

            [ -n "$first_digest" ] || first_digest="$digest"
            printf -- '- `%s:%s` — `%s`\n' "$img" "$IMAGE_TAG" "$digest" >> /tmp/released-images.md
          done

          [ -n "$RELEASE_COMMIT" ] || RELEASE_COMMIT="$SHA"
          echo "digest=$first_digest" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          {
            echo 'images<<RELEASE_IMAGES_EOF'
            cat /tmp/released-images.md
            echo 'RELEASE_IMAGES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Created through the git-data API, NOT `git push`. A token-authenticated
      # push is rejected whenever the ref being pushed carries a workflow file
      # that differs from the default branch's — "refusing to allow a GitHub App
      # to create or update workflow ... without `workflows` permission` — and
      # GITHUB_TOKEN cannot hold that scope at all. That happens routinely here:
      # the tag lands on the commit the image came from, and any later CI change
      # makes its .github/workflows differ from main. The API creates a tag
      # object pointing at an existing commit, introducing no file changes, so
      # the check does not apply.
      - name: create the annotated tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GIT_TAG: ${{ steps.plan.outputs.git_tag }}
          RELEASE_COMMIT: ${{ steps.promote.outputs.release_commit }}
          BEHIND: ${{ steps.promote.outputs.behind }}
        with:
          script: |
            const tag = process.env.GIT_TAG;
            const sha = process.env.RELEASE_COMMIT;
            const behind = process.env.BEHIND;
            // Annotated, not lightweight: `git show <tag>` should answer who cut
            // this and when without a round trip to the API.
            const { data: tagObject } = await github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
              message: `${tag}\n\nReleased by ${context.actor} via the release-image workflow. `
                + `Promoted the image digest built from ${sha} — no rebuild. `
                + `(${behind} commit(s) on ${context.ref.replace('refs/heads/', '')} after it changed no image inputs.)`,
              object: sha,
              type: 'commit',
            });
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: tagObject.sha,
            });
            core.info(`tagged ${sha} as ${tag}`);

      # github-script rather than curl/gh: `gh` is absent from the bare ARC
      # runner image, and hand-building JSON for an arbitrary human-written
      # summary in shell is an escaping bug waiting to happen. Node is always
      # present — it is what runs JS actions.
      - name: publish the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GIT_TAG: ${{ steps.plan.outputs.git_tag }}
          SUMMARY: ${{ inputs.summary }}
          IMAGE_LINES: ${{ steps.promote.outputs.images }}
        with:
          script: |
            const tag = process.env.GIT_TAG;
            const summary = (process.env.SUMMARY || '').trim();
            const images = (process.env.IMAGE_LINES || '').trim();

            // `body` is PRE-pended to the generated notes by the API when
            // generate_release_notes is true, which is exactly the shape decided
            // in cshuttle/workflows#30: optional human lead, generated list below.
            const parts = [];
            if (summary) parts.push(summary);
            if (images) parts.push(`### Released images\n\n${images}`);

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: parts.join('\n\n'),
              generate_release_notes: true,
            });
            core.info(`published ${data.html_url}`);
            await core.summary
              .addHeading(`Released ${tag}`)
              .addLink(data.html_url, data.html_url)
              .write();
